[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamtrain"
version = "0.1.0"
description = "Resource-aware, streaming, resumable AI training for PyTorch."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0.0",
    "psutil",
    "pyyaml"
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black",
    "ruff",
    "pre-commit"
]

[project.scripts]
streamtrain = "streamtrain.cli.main:main"
